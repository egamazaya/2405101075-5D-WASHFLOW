<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
const P = Layout.mount('Antrean Kendaraan', 'antrean');
const NEXT = {menunggu: ['dicuci', 'Mulai Cuci'], dicuci: ['selesai', 'Selesaikan']};
function render() {
  const d = DB.get(), f = document.getElementById('flt') ? flt.value : '';
  const rows = d.antrean.filter(a => !f || a.status === f).map(a => `<tr><td class="fw-semibold">${a.kode}</td><td>${a.plat}</td><td>${a.nama}</td>
    <td>${layananOf(d, a.idLayanan).nama}</td><td>${a.waktu}</td><td>${badge(a.status)}</td>
    <td>${NEXT[a.status] ? `<button class="btn btn-sm btn-outline-primary" onclick="adv(${a.id})">${NEXT[a.status][1]}</button>` : '-'}</td></tr>`).join('');
  P.innerHTML = `<div class="card-wf p-3"><div class="row g-2 mb-3"><div class="col-md-6"><input class="form-control" placeholder="Cari plat / nama..." data-table-search="#tb"></div>
    <div class="col-md-3"><select id="flt" class="form-select" onchange="render()"><option value="">Semua status</option>${Object.keys(STATUS).map(s => `<option value="${s}" ${s === f ? 'selected' : ''}>${STATUS[s][0]}</option>`).join('')}</select></div></div>
    <div class="table-responsive"><table id="tb" class="table table-wf align-middle"><thead><tr><th>Kode</th><th>Plat</th><th>Pelanggan</th><th>Layanan</th><th>Masuk</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="text-center text-muted">Belum ada data</td></tr>'}</tbody></table></div></div>`;
  document.querySelectorAll('[data-table-search]').forEach(i => i.addEventListener('keyup', function () { const t = this.value.toLowerCase(); document.querySelectorAll('#tb tbody tr').forEach(r => r.style.display = r.textContent.toLowerCase().includes(t) ? '' : 'none'); }));
}
function adv(id) { const d = DB.get(), a = d.antrean.find(x => x.id === id); a.status = NEXT[a.status][0]; DB.set(d); render(); }
render();
</script>
<script src="assets/js/main.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
const P = Layout.mount('Dashboard', 'dashboard'), d = DB.get();
const n = s => d.antrean.filter(a => a.status === s).length;
const omzet = d.antrean.filter(a => a.status === 'dibayar').reduce((t, a) => t + a.harga, 0);
const cards = [['Total Kendaraan', d.antrean.length, 'car-front', 'primary'], ['Menunggu', n('menunggu'), 'hourglass-split', 'warning'],
  ['Sedang Dicuci', n('dicuci'), 'droplet-half', 'info'], ['Pendapatan Hari Ini', rp(omzet), 'cash-stack', 'success']];
P.innerHTML = `<div class="row g-3 mb-3">${cards.map(c => `<div class="col-6 col-lg-3"><div class="card-wf p-3 d-flex align-items-center gap-3">
  <i class="bi bi-${c[2]} fs-2 text-${c[3]}"></i><div><div class="text-muted small">${c[0]}</div><div class="fw-bold fs-5">${c[1]}</div></div></div></div>`).join('')}</div>
  <div class="card-wf p-3"><h6 class="fw-bold">Layanan Paling Sering Dipesan</h6><canvas id="ch" height="90"></canvas></div>`;
const cnt = {}; d.antrean.forEach(a => { const k = layananOf(d, a.idLayanan).nama; cnt[k] = (cnt[k] || 0) + 1; });
new Chart(document.getElementById('ch'), {type: 'bar', data: {labels: Object.keys(cnt), datasets: [{label: 'Jumlah', data: Object.values(cnt), backgroundColor: '#0284c7'}]}, options: {plugins: {legend: {display: false}}}});
</script>
<script src="assets/js/main.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#0a192f,#1a3c61)">
<div class="card-wf p-4" style="width:380px;max-width:92vw">
<h3 class="fw-bold text-center mb-1"><i class="bi bi-water text-info"></i> Wash<span class="text-info">Flow</span></h3>
<p class="text-muted text-center small mb-3">Sistem Manajemen Cuci Kendaraan</p>
<div id="err" class="alert alert-danger py-2 small d-none"></div>
<form id="f"><div class="mb-2"><label class="form-label small fw-semibold">Username</label><input id="u" class="form-control" required></div>
<div class="mb-3"><label class="form-label small fw-semibold">Password</label><input id="p" type="password" class="form-control" required></div>
<button class="btn btn-primary-wf w-100">Masuk</button></form>
<div class="d-flex gap-2 mt-3"><button class="btn btn-outline-secondary btn-sm flex-fill" onclick="demo(\x27admin\x27,\x27admin123\x27)">Demo Admin</button>
<button class="btn btn-outline-secondary btn-sm flex-fill" onclick="demo(\x27kasir\x27,\x27kasir123\x27)">Demo Kasir</button></div>
<a href="cek-status.html" class="d-block text-center small mt-3">Cek status kendaraan Anda</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
const USERS = [{u:'admin',p:'admin123',nama:'Administrator',role:'Admin'},{u:'kasir',p:'kasir123',nama:'Kasir WashFlow',role:'Kasir'}];
function demo(u, p) { document.getElementById('u').value = u; document.getElementById('p').value = p; }
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const m = USERS.find(x => x.u === u.value.trim() && x.p === p.value);
  if (!m) { err.textContent = 'Username atau password salah.'; err.classList.remove('d-none'); return; }
  sessionStorage.setItem('wf_user', JSON.stringify(m)); location.href = 'dashboard.html';
});
</script>

</body></html>

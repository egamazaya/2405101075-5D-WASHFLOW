<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
const P = Layout.mount('Kasir & Pembayaran', 'kasir');
let cur = null;
function render() {
  const d = DB.get(), rows = d.antrean.filter(a => a.status === 'selesai').map(a => `<tr><td>${a.kode}</td><td>${a.plat}</td><td>${a.nama}</td><td>${layananOf(d, a.idLayanan).nama}</td><td class="fw-semibold">${rp(a.harga)}</td>
    <td><button class="btn btn-sm btn-primary-wf" onclick="bayar(${a.id})">Bayar</button></td></tr>`).join('');
  P.innerHTML = `<div class="card-wf p-3"><h6 class="fw-bold">Menunggu Pembayaran</h6><div class="table-responsive"><table class="table table-wf align-middle"><thead><tr><th>Kode</th><th>Plat</th><th>Pelanggan</th><th>Layanan</th><th>Total</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="text-center text-muted">Tidak ada tagihan.</td></tr>'}</tbody></table></div></div>
    <div class="modal fade" id="m"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h6 class="modal-title fw-bold">Pembayaran</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="mb"></div></div></div></div>`;
}
function bayar(id) {
  const d = DB.get(); cur = d.antrean.find(a => a.id === id);
  mb.innerHTML = `<div class="mb-2">${cur.kode} — ${cur.plat}<div class="fs-4 fw-bold text-primary">${rp(cur.harga)}</div></div>
    <label class="form-label small fw-semibold">Metode</label><select id="met" class="form-select mb-2"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select>
    <label class="form-label small fw-semibold">Uang Diterima</label><input id="uang" type="number" class="form-control mb-2" oninput="kem.textContent=rp(Math.max(0,this.value-cur.harga))">
    <div class="small">Kembalian: <b id="kem">Rp 0</b></div><div id="er" class="text-danger small"></div>
    <button class="btn btn-primary-wf w-100 mt-3" onclick="simpan()">Konfirmasi Pembayaran</button>`;
  bootstrap.Modal.getOrCreateInstance(document.getElementById('m')).show();
}
function simpan() {
  if (+uang.value < cur.harga) { er.textContent = 'Uang diterima kurang dari total.'; return; }
  const d = DB.get(), a = d.antrean.find(x => x.id === cur.id); a.status = 'dibayar'; a.metode = met.value;
  const p = d.pelanggan.find(x => x.nama === a.nama); if (p) { p.poin += Math.floor(a.harga / 10000); p.kunjungan++; }
  DB.set(d);
  mb.innerHTML = `<div class="receipt-paper text-center p-3 border"><b>WASHFLOW</b><hr><div>${a.kode} • ${a.plat}</div><div>${layananOf(d, a.idLayanan).nama}</div><hr>
    <div class="fw-bold">TOTAL ${rp(a.harga)}</div><div class="small">${a.metode} • Kembali ${rp(uang.value - a.harga)}</div><hr><div class="small">Terima kasih!</div></div>
    <button class="btn btn-outline-secondary w-100 mt-3" onclick="window.print()"><i class="bi bi-printer"></i> Cetak Nota</button>`;
  document.getElementById('m').addEventListener('hidden.bs.modal', render, {once: true});
}
render();
</script>
<script src="assets/js/main.js"></script>
</body></html>

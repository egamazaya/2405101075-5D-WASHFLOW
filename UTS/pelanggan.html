<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
const P = Layout.mount('Pelanggan & Poin Member', 'pelanggan'), d = DB.get();
P.innerHTML = `<div class="card-wf p-3"><input class="form-control mb-3" style="max-width:320px" placeholder="Cari pelanggan..." data-table-search="#tb">
  <div class="table-responsive"><table id="tb" class="table table-wf align-middle"><thead><tr><th>Nama</th><th>Telepon</th><th>Kunjungan</th><th>Poin</th></tr></thead><tbody>
  ${d.pelanggan.map(p => `<tr><td class="fw-semibold">${p.nama}</td><td>${p.telp}</td><td>${p.kunjungan}</td><td><span class="badge bg-info">${p.poin} poin</span></td></tr>`).join('')}</tbody></table></div></div>`;
</script>
<script src="assets/js/main.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
const P = Layout.mount('Input Kendaraan Baru', 'registrasi'), d = DB.get();
P.innerHTML = `<div class="card-wf p-4" style="max-width:640px"><form id="f" novalidate>
  <div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Plat Nomor</label><input id="plat" class="form-control input-plat" placeholder="B 1234 ABC" required><div class="invalid-feedback">Plat nomor wajib diisi.</div></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Nama Pelanggan</label><input id="nama" class="form-control" required><div class="invalid-feedback">Nama wajib diisi.</div></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Jenis Kendaraan</label><select id="jenis" class="form-select"><option>Mobil</option><option>Motor</option></select></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Paket Layanan</label><select id="lay" class="form-select"></select></div></div>
  <div id="info" class="alert alert-info mt-3 mb-3 py-2 small"></div>
  <button class="btn btn-primary-wf"><i class="bi bi-check-lg"></i> Simpan & Masuk Antrean</button></form></div>`;
function fillLay() { lay.innerHTML = d.layanan.filter(l => l.jenis === jenis.value).map(l => `<option value="${l.id}">${l.nama}</option>`).join(''); info_(); }
function info_() { const l = layananOf(d, lay.value); info.innerHTML = `Harga: <b>${rp(l.harga)}</b> • Estimasi: <b>${l.durasi} menit</b><br>${l.deskripsi || ''}`; }
jenis.onchange = fillLay; lay.onchange = info_; fillLay();
f.addEventListener('submit', e => {
  e.preventDefault(); let ok = true;
  [plat, nama].forEach(i => { const bad = !i.value.trim(); i.classList.toggle('is-invalid', bad); if (bad) ok = false; });
  if (!ok) return;
  const l = layananOf(d, lay.value), id = Math.max(0, ...d.antrean.map(a => a.id)) + 1;
  d.antrean.push({id, kode: 'WF-' + String(id).padStart(3, '0'), plat: plat.value.trim(), nama: nama.value.trim(), idLayanan: l.id, harga: l.harga, status: 'menunggu',
    waktu: new Date().toTimeString().slice(0, 5)});
  if (!d.pelanggan.some(p => p.nama.toLowerCase() === nama.value.trim().toLowerCase())) d.pelanggan.push({id: d.pelanggan.length + 1, nama: nama.value.trim(), telp: '-', poin: 0, kunjungan: 0});
  DB.set(d); location.href = 'antrean.html';
});
</script>
<script src="assets/js/main.js"></script>
</body></html>
